<!doctype html>
<html><head><meta charset="utf-8"><title>08 models</title>
<link rel="stylesheet" href="lib/stage.css"><script src="lib/stage.js"></script>
<style>
  #bg { position: absolute; inset: 0; background: radial-gradient(1000px 800px at 22% 40%, rgba(148, 184, 255, 0.07), transparent 70%), var(--bg); }
  #calm { position: absolute; left: 1060px; top: 150px; width: 780px; height: 600px; display: grid; place-items: center; }
  #calm img { width: 300px; opacity: 0.035; }
  #title { position: absolute; left: 110px; top: 92px; font-size: 56px; font-weight: 650; }
  #sub { position: absolute; left: 112px; top: 166px; font-size: 26px; color: var(--muted); }
  .tile { position: absolute; width: 432px; height: 150px; border-radius: 22px; background: var(--card); border: 2px solid #333; padding: 20px 24px; }
  .tile .verb { font-size: 21px; font-weight: 700; letter-spacing: 0.14em; color: var(--model); display: flex; align-items: center; gap: 10px; }
  .tile .name { font-size: 33px; font-weight: 600; margin-top: 8px; color: var(--ink); }
  .tile .job { font-size: 21px; color: var(--muted); margin-top: 6px; }
  .tile.private .verb { color: var(--house); }
  #close { position: absolute; left: 112px; top: 786px; font-family: var(--serif); font-size: 46px; color: var(--ink); }
  #close span { color: var(--coral); }
</style></head>
<body><div id="stage">
  <div id="bg"></div>
  <div id="calm"><img src="img/tellhouse-mark-white.svg" alt=""></div>
  <div id="title">Five models. One job each.</div>
  <div id="sub">Meta’s models, through the Meta Model API.</div>
  <div id="tiles"></div>
  <div id="close">Each one proposes. <span>The house, and a person, decide.</span></div>
</div>
<script>
  const ICON = {
    hear: '<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    read: '<path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/>',
    review: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
    see: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    draw: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
  };
  const TILES = [
    ['hear', 'HEAR', 'Muse Voice Transcribe', 'Speech into words you can check', 3.8],
    ['read', 'READ', 'Muse Spark', 'Words into the household record', 6.8],
    ['review', 'REVIEW', 'Muse Wonder', 'What needs attention, with sources', 8.6],
    ['see', 'SEE', 'SAM 3.1', 'Counts the pantry shelf', 17.3],
    ['draw', 'DRAW', 'Muse Image', 'Picture cards at a glance', 20.6],
    ['lock', 'PRIVATE', 'No model', 'Anything marked private', 25.0],
  ];
  const host = document.getElementById('tiles');
  const tiles = TILES.map(([icon, verb, name, job, at], i) => {
    const d = document.createElement('div');
    d.className = 'tile' + (icon === 'lock' ? ' private' : '');
    d.style.left = (110 + (i % 2) * 456) + 'px';
    d.style.top = (232 + Math.floor(i / 2) * 174) + 'px';
    d.innerHTML = `<div class="verb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON[icon]}</svg>${verb}</div><div class="name">${name}</div><div class="job">${job}</div>`;
    host.appendChild(d);
    return { d, at, priv: icon === 'lock', next: (TILES[i + 1] || [])[4] };
  });
  const $ = T.$;
  Scene(33.2, (t) => {
    $('#stage').style.opacity = T.fade(t, 0, 0.8);
    const h = T.easeOut(T.prog(t, 0.4, 0.8));
    T.set($('#title'), { opacity: h, transform: `translateY(${(1 - h) * 10}px)` });
    $('#sub').style.opacity = T.fade(t, 0.9, 0.7);
    $('#calm').style.opacity = T.fade(t, 0.6, 1.0);
    tiles.forEach(({ d, at, priv, next }, i) => {
      const shown = T.easeOut(T.prog(t, 1.2 + i * 0.12, 0.6));
      const on = T.easeOut(T.prog(t, at, 0.45));
      // Bright while it is the one being spoken about, then a softer "on".
      const focus = priv ? on : on * (1 - 0.55 * T.prog(t, (next || at + 3) - 0.1, 0.6));
      const accent = priv ? '127,212,193' : '148,184,255';
      d.style.opacity = (0.35 + 0.65 * shown) * (0.55 + 0.45 * Math.max(on, 0.0001) + (on > 0 ? 0 : 0)) + '';
      d.style.borderColor = on > 0 ? `rgba(${accent},${(0.35 + 0.6 * focus).toFixed(3)})` : '#333';
      d.style.background = `rgba(${priv ? '18,48,42' : '28,38,60'},${(0.25 + 0.75 * focus).toFixed(3)})`;
      d.style.boxShadow = `0 0 ${(46 * focus).toFixed(1)}px rgba(${accent},${(0.28 * focus).toFixed(3)})`;
      d.style.transform = `translateY(${((1 - shown) * 12).toFixed(2)}px) scale(${(1 + 0.025 * focus).toFixed(4)})`;
    });
    const c = T.easeOut(T.prog(t, 27.4, 0.9));
    T.set($('#close'), { opacity: c, transform: `translateY(${(1 - c) * 10}px)` });
  });
</script></body></html>
