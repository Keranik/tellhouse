<!doctype html>
<html><head><meta charset="utf-8"><title>07 promise</title>
<link rel="stylesheet" href="lib/stage.css"><script src="lib/stage.js"></script>
<style>
  #q1 { position: absolute; left: 0; right: 0; top: 104px; text-align: center; font-family: var(--serif); font-size: 54px; color: #b9b2aa; }
  #q2 { position: absolute; left: 0; right: 0; top: 178px; text-align: center; font-family: var(--serif); font-size: 70px; color: var(--ink); }
  #q2 .hl { background-image: linear-gradient(var(--coral), var(--coral)); background-repeat: no-repeat; background-position: 0 94%; background-size: 0% 6px; }
  svg#tl { position: absolute; left: 0; top: 0; }
  .card { position: absolute; padding: 18px 26px 22px; border-radius: 22px; background: var(--card); border: 2px solid #333; }
  .card small { display: block; font-family: var(--sans); font-size: 22px; color: var(--muted); margin-bottom: 6px; }
  .card div { font-family: var(--serif); font-size: 46px; line-height: 1.15; }
  #promise { left: 150px; top: 418px; border-color: rgba(242,132,111,0.65); }
  #kept { left: 1010px; top: 418px; border-color: rgba(146,217,154,0.7); display: flex; gap: 18px; align-items: center; }
  #kept .check { width: 58px; height: 58px; border-radius: 50%; background: rgba(146,217,154,0.16); display: grid; place-items: center; color: var(--ok); flex: none; }
  #now { position: absolute; top: 588px; font-size: 24px; font-weight: 600; color: var(--wait); transform: translateX(-50%); white-space: nowrap; }
  .ev { position: absolute; font-size: 21px; color: #8f8f8f; transform: translateX(-50%); white-space: nowrap; text-align: center; }
</style></head>
<body><div id="stage">
  <div id="q1">Households don’t fail on forgotten facts.</div>
  <div id="q2">They fail on <span class="hl">forgotten promises.</span></div>
  <svg id="tl" width="1920" height="1080"></svg>
  <div id="promise" class="card"><small>5:40 AM · Daniel</small><div>“home by three”</div></div>
  <div id="kept" class="card"><div class="check"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div>
    <div><small>2:55 PM · Daniel</small><div>“Home, like I said this morning.”</div></div></div>
  <div id="now"></div>
</div>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('tl');
  const X0 = 200, PX = 95, Y = 650;               // 5 AM at X0, 95 px per hour
  const xAt = (h) => X0 + (h - 5) * PX;            // h in hours, e.g. 14.9167 for 2:55 PM
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  const base = el('line', { x1: X0, y1: Y, x2: xAt(21), y2: Y, stroke: '#3c3c3c', 'stroke-width': 4, 'stroke-linecap': 'round' });
  const len = xAt(21) - X0;
  base.setAttribute('stroke-dasharray', `${len} ${len}`);
  const past = el('line', { x1: X0, y1: Y, x2: X0, y2: Y, stroke: '#8a8a8a', 'stroke-width': 4, 'stroke-linecap': 'round' });
  const ticks = [], labels = [];
  for (let h = 5; h <= 21; h++) {
    ticks.push(el('line', { x1: xAt(h), y1: Y - (h % 2 ? 12 : 7), x2: xAt(h), y2: Y + (h % 2 ? 12 : 7), stroke: '#555', 'stroke-width': 2 }));
    if (h % 2 === 1) {
      const txt = el('text', { x: xAt(h), y: Y + 46, fill: '#8f8f8f', 'font-size': 22, 'font-family': 'Inter', 'text-anchor': 'middle' });
      txt.textContent = h === 5 ? '5 AM' : h === 13 ? '1 PM' : h === 21 ? '9 PM' : String(h > 12 ? h - 12 : h);
      labels.push(txt);
    }
  }
  // The promise, and where it is due.
  const promiseDot = el('circle', { cx: xAt(5 + 40 / 60), cy: Y, r: 11, fill: '#f2846f' });
  const promiseStem = el('line', { x1: xAt(5 + 40 / 60), y1: Y - 12, x2: xAt(5 + 40 / 60), y2: 548, stroke: '#f2846f', 'stroke-width': 3 });
  const due = el('circle', { cx: xAt(15), cy: Y, r: 15, fill: 'none', stroke: '#f2846f', 'stroke-width': 3, 'stroke-dasharray': '6 6' });
  const dueLbl = el('text', { x: xAt(15), y: Y + 84, fill: '#f2846f', 'font-size': 21, 'font-family': 'Inter', 'text-anchor': 'middle' });
  dueLbl.textContent = 'due 3:00 PM';
  // The day going by.
  const events = [[7.25, 'Margaret: “Where’s Daniel?”', 0], [9.0833, 'Bridge club ride planned', 1], [12.6667, 'Last of the gauze', 0]];
  const evEls = events.map(([h, text, row]) => {
    const dot = el('circle', { cx: xAt(h), cy: Y, r: 7, fill: '#6f6f6f' });
    const d = document.createElement('div'); d.className = 'ev'; d.textContent = text;
    d.style.left = xAt(h) + 'px'; d.style.top = (Y + (row ? 118 : 84) - 22) + 'px';
    document.getElementById('stage').appendChild(d);
    return { h, dot, d };
  });
  const head = el('line', { x1: 0, y1: Y - 34, x2: 0, y2: Y + 34, stroke: '#f4c771', 'stroke-width': 4, 'stroke-linecap': 'round' });
  const keptDot = el('circle', { cx: xAt(14 + 55 / 60), cy: Y, r: 12, fill: '#92d99a' });
  const keptStem = el('line', { x1: xAt(14 + 55 / 60), y1: Y - 12, x2: xAt(14 + 55 / 60), y2: 560, stroke: '#92d99a', 'stroke-width': 3 });
  const arc = el('path', { d: `M 420 412 C 600 300, 1050 300, 1260 412`, fill: 'none', stroke: '#92d99a', 'stroke-width': 3, 'stroke-dasharray': '1000 1000', 'stroke-linecap': 'round' });
  const arcLbl = el('text', { x: 840, y: 318, fill: '#92d99a', 'font-size': 24, 'font-family': 'Inter', 'font-weight': 600, 'text-anchor': 'middle', 'letter-spacing': '2' });
  arcLbl.textContent = 'KEPT';
  const arcLen = arc.getTotalLength();
  arc.setAttribute('stroke-dasharray', `${arcLen} ${arcLen}`);
  const fmt = (h) => { const hh = Math.floor(h), mm = Math.floor((h - hh) * 60); const ap = hh >= 12 ? 'PM' : 'AM'; return `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, '0')} ${ap}`; };

  const $ = T.$;
  Scene(22, (t) => {
    $('#stage').style.opacity = T.fade(t, 0, 0.8);
    const draw = T.easeInOut(T.prog(t, 0.5, 1.2));
    base.setAttribute('stroke-dashoffset', (len * (1 - draw)).toFixed(1));
    ticks.forEach((k, i) => k.setAttribute('opacity', T.fade(t, 0.6 + i * 0.05, 0.3).toFixed(3)));
    labels.forEach((k, i) => k.setAttribute('opacity', T.fade(t, 0.8 + i * 0.09, 0.4).toFixed(3)));
    // The promise is made.
    const p = T.easeOut(T.prog(t, 1.4, 0.6));
    promiseDot.setAttribute('opacity', p); promiseStem.setAttribute('opacity', p);
    T.set($('#promise'), { opacity: p, transform: `translateY(${(1 - p) * 14}px)` });
    const d = T.fade(t, 2.3, 0.6);
    due.setAttribute('opacity', d.toFixed(3)); dueLbl.setAttribute('opacity', d.toFixed(3));
    // The line.
    const a = T.easeOut(T.prog(t, 3.0, 0.9));
    T.set($('#q1'), { opacity: a, transform: `translateY(${(1 - a) * 10}px)` });
    const b = T.easeOut(T.prog(t, 5.6, 0.9));
    T.set($('#q2'), { opacity: b, transform: `translateY(${(1 - b) * 10}px)` });
    $('#q2 .hl').style.backgroundSize = `${(100 * T.easeInOut(T.prog(t, 6.6, 0.9))).toFixed(1)}% 6px`;
    // The day goes by.
    const hNow = 5 + 40 / 60 + (14 + 55 / 60 - (5 + 40 / 60)) * T.easeInOut(T.prog(t, 8.0, 6.8));
    const sweeping = t >= 7.6;
    head.setAttribute('opacity', (sweeping ? T.fade(t, 7.6, 0.4) * (1 - T.prog(t, 15.4, 0.6)) : 0).toFixed(3));
    head.setAttribute('x1', xAt(hNow)); head.setAttribute('x2', xAt(hNow));
    past.setAttribute('x2', (sweeping ? xAt(hNow) : X0).toFixed(1));
    past.setAttribute('opacity', sweeping ? 1 : 0);
    const nowEl = $('#now');
    nowEl.textContent = fmt(hNow); nowEl.style.left = xAt(hNow) + 'px';
    nowEl.style.opacity = head.getAttribute('opacity');
    for (const e of evEls) {
      const on = sweeping && hNow >= e.h ? T.fade(t, 8 + 6.8 * ((e.h - 5.667) / (14.9167 - 5.667)), 0.5) : 0;
      e.dot.setAttribute('fill', on > 0.5 ? '#a8a8a8' : '#555'); e.d.style.opacity = on.toFixed(3);
    }
    // 2:55 PM: home, like he said.
    const k = T.easeOut(T.prog(t, 15.0, 0.6));
    keptDot.setAttribute('opacity', k); keptStem.setAttribute('opacity', k);
    T.set($('#kept'), { opacity: k, transform: `translateY(${(1 - k) * 14}px)` });
    due.setAttribute('stroke', k > 0.5 ? '#92d99a' : '#f2846f');
    dueLbl.textContent = k > 0.5 ? 'kept, five minutes early' : 'due 3:00 PM';
    dueLbl.setAttribute('fill', k > 0.5 ? '#92d99a' : '#f2846f');
    const r = T.easeInOut(T.prog(t, 16.0, 1.1));
    arc.setAttribute('stroke-dashoffset', (arcLen * (1 - r)).toFixed(1));
    arc.setAttribute('opacity', r > 0 ? 1 : 0);
    arcLbl.setAttribute('opacity', T.fade(t, 16.8, 0.5).toFixed(3));
  });
</script></body></html>
