<!doctype html>
<html><head><meta charset="utf-8"><title>02 margaret</title>
<link rel="stylesheet" href="lib/stage.css"><script src="lib/stage.js"></script>
<style>
  #room { position: absolute; inset: 0; background:
    radial-gradient(1200px 900px at 88% 18%, rgba(255, 196, 120, 0.22), transparent 70%),
    radial-gradient(900px 700px at 10% 100%, rgba(120, 70, 40, 0.18), transparent 70%),
    linear-gradient(180deg, #1f1a15 0%, #1a1714 60%, #161412 100%); }
  #window { right: 110px; top: 110px; }
  #beams { position: absolute; inset: 0; pointer-events: none; }
  #time { left: 120px; top: 96px; font-weight: 300; font-size: 72px; letter-spacing: 0.02em; color: #f3e3c8; }
  #time small { display: block; font-size: 24px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #a8957a; margin-top: 10px; }
  #convo { position: absolute; left: 260px; width: 1160px; top: 280px; }
  #ask { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  #askWho { font-size: 22px; color: #b8a78f; }
  #askBubble { font-family: var(--serif); font-size: 84px; font-weight: 500; line-height: 1.1; color: #2a2117;
    background: #f1e6d4; padding: 26px 46px 32px; border-radius: 40px 40px 10px 40px; box-shadow: 0 30px 80px rgba(0,0,0,0.35); }
  #mic { display: flex; align-items: center; gap: 14px; height: 76px; padding: 0 28px; border-radius: 38px; background: rgba(241, 230, 212, 0.12); border: 1px solid rgba(241,230,212,0.25); color: #f1e6d4; font-size: 22px; }
  #mic .bars { display: flex; align-items: center; gap: 6px; height: 34px; }
  #mic .bars i { display: block; width: 6px; border-radius: 3px; background: #f1e6d4; }
  #reply { margin-top: 56px; width: 1040px; padding: 30px 40px 36px; box-shadow: 0 30px 80px rgba(0,0,0,0.35); }
  #replyHead { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; font-size: 22px; font-weight: 600; color: var(--ink); }
  #replyHead img { width: 38px; height: 38px; }
  #replyHead span { font-weight: 400; color: var(--muted); }
  #replyText { font-family: var(--serif); font-size: 50px; line-height: 1.3; color: var(--ink); min-height: 65px; }
  .hl { background-image: linear-gradient(var(--coral), var(--coral)); background-repeat: no-repeat; background-position: 0 92%; background-size: 0% 5px; padding-bottom: 2px; }
</style></head>
<body><div id="stage">
  <div id="room"></div>
  <svg id="beams" width="1920" height="1080"></svg>
  <svg id="window" class="abs" width="360" height="460" viewBox="0 0 360 460">
    <rect x="6" y="6" width="348" height="448" rx="10" fill="rgba(255,214,150,0.07)" stroke="#d9b98a" stroke-opacity="0.45" stroke-width="5"/>
    <line x1="180" y1="6" x2="180" y2="454" stroke="#d9b98a" stroke-opacity="0.4" stroke-width="4"/>
    <line x1="6" y1="230" x2="354" y2="230" stroke="#d9b98a" stroke-opacity="0.4" stroke-width="4"/>
    <rect x="-14" y="454" width="388" height="14" rx="4" fill="#d9b98a" fill-opacity="0.3"/>
  </svg>
  <div id="time" class="abs">7:15 AM<small>Margaret is up</small></div>
  <div id="convo">
    <div id="ask"><div id="askWho">Margaret · 7:15 AM</div>
      <div id="mic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><div class="bars"><i></i><i></i><i></i><i></i><i></i></div></div>
      <div id="askBubble">Where’s Daniel?</div></div>
    <div id="reply" class="house-reply"><div id="replyHead"><img src="img/favicon.svg" alt="">Tellhouse <span>· from the record</span></div><div id="replyText"></div></div>
  </div>
</div>
<script>
  const ANSWER_A = 'Daniel said this morning: depot by nine, the hardware store after, ';
  const ANSWER_B = 'home by three';
  const ANSWER = ANSWER_A + ANSWER_B + '.';
  const TYPE_AT = 4.9, CPS = 14, DONE = T.typingDone(ANSWER, TYPE_AT, CPS);
  const beams = document.getElementById('beams');
  const NS = 'http://www.w3.org/2000/svg';
  const beamEls = [0, 1, 2].map((i) => {
    const p = document.createElementNS(NS, 'polygon');
    const x = 1500 + i * 120;
    p.setAttribute('points', `${x},120 ${x + 90},120 ${x - 760},1080 ${x - 980},1080`);
    p.setAttribute('fill', '#ffd9a0'); beams.appendChild(p); return p;
  });
  const $ = T.$;
  Scene(20, (t) => {
    $('#stage').style.opacity = T.fade(t, 0, 1.2);
    beamEls.forEach((b, i) => b.setAttribute('opacity', (0.035 + 0.02 * Math.sin(t * 0.6 + i * 1.7)).toFixed(4)));
    T.set($('#time'), { opacity: T.fade(t, 0.5, 1.0) });
    $('#askWho').style.opacity = T.fade(t, 1.0, 0.6);
    // A moment of listening, then her words.
    const micShow = T.fade(t, 1.0, 0.4) * (1 - T.prog(t, 2.0, 0.25));
    $('#mic').style.display = t < 2.25 ? 'flex' : 'none';
    $('#mic').style.opacity = micShow;
    [...document.querySelectorAll('#mic .bars i')].forEach((bar, i) => {
      bar.style.height = (8 + 24 * Math.abs(Math.sin(t * 9 + i * 1.3))).toFixed(1) + 'px';
    });
    const ask = T.easeOut(T.prog(t, 2.25, 0.6));
    T.set($('#askBubble'), { display: t >= 2.25 ? 'block' : 'none', opacity: ask, transform: `translateY(${(1 - ask) * 18}px)` });
    // The house answers from the record, in Daniel's words.
    const rep = T.easeOut(T.prog(t, 4.2, 0.6));
    T.set($('#reply'), { opacity: rep, transform: `translateY(${(1 - rep) * 22}px)` });
    const el = $('#replyText');
    if (t < DONE) {
      el.innerHTML = '';
      el.append(T.typed(ANSWER, t, TYPE_AT, CPS));
      if (t >= TYPE_AT - 0.4 && T.caretOn(t)) { const c = document.createElement('span'); c.className = 'caret'; el.append(c); }
    } else {
      el.innerHTML = `${ANSWER_A}<span class="hl">${ANSWER_B}</span>.`;
      el.querySelector('.hl').style.backgroundSize = `${(100 * T.easeInOut(T.prog(t, DONE + 0.9, 0.9))).toFixed(1)}% 5px`;
    }
  });
</script></body></html>
